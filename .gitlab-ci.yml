stages:
  - verify
  - build
  - deploy

variables:
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/mme_eval
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

backend_verify:
  stage: verify
  tags:
    - build
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --frozen --extra dev --extra server --extra llm-openai --extra postgres --extra langfuse
    - uv run pytest -q

frontend_verify:
  stage: verify
  tags:
    - build
  image: node:20-alpine
  before_script:
    - npm install --global npm@11.16.0
  script:
    - cd frontend
    - npm ci
    - npm run verify
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - frontend/dist/

docker_build_verify:
  stage: build
  tags:
    - build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --pull --tag "mme-eval:${CI_COMMIT_SHA}" .

deploy_production:
  stage: deploy
  image: alpine:3.20
  tags:
    - build
  resource_group: mme-production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $SSH_PRIVATE_KEY_FILE && $SSH_KNOWN_HOSTS_FILE'
  before_script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - test -s "$SSH_PRIVATE_KEY_FILE"
    - test -s "$SSH_KNOWN_HOSTS_FILE"
    - cp "$SSH_PRIVATE_KEY_FILE" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS_FILE" ~/.ssh/known_hosts
  script:
    - >-
      ssh -i ~/.ssh/id_ed25519
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      "${DEPLOY_USER}@${DEPLOY_HOST}"
      "cd '${DEPLOY_PATH}' && MME_DEPLOY_COMMIT='${CI_COMMIT_SHA}' scripts/deploy_release.sh"
  environment:
    name: production
