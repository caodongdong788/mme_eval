stages:
  - deploy

variables:
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/mme_eval

deploy_production:
  stage: deploy
  image: alpine:3.20
  resource_group: mme-production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $SSH_PRIVATE_KEY && $SSH_KNOWN_HOSTS'
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - >-
      ssh -i ~/.ssh/id_ed25519
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      "${DEPLOY_USER}@${DEPLOY_HOST}"
      "cd '${DEPLOY_PATH}' && scripts/deploy_release.sh"
  environment:
    name: production
