# MME · Agent 评测平台 — Docker Compose（app + Postgres + 持久化 volume）
#
# 快速开始：
#   cp .env.docker.example .env   # 编辑 SESSION_SECRET、域名、飞书等
#   docker compose up -d --build
#   open http://localhost:8000
#
# 评测任务通过 Postgres 租约队列交给独立 worker；部署 app 不会中断在跑评测。

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-medeval}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medeval} -d ${POSTGRES_DB:-medeval}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: mme-eval:${MME_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${MME_APP_MEMORY_LIMIT:-2g}
    cpus: ${MME_APP_CPU_LIMIT:-2}
    logging: *default-logging
    ports:
      - "${MME_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 确保容器内 DB 主机名指向 compose 网络中的 db 服务
      MEDEVAL_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medeval}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-medeval}
      MEDEVAL_OUTPUTS_DIR: /data/outputs
      MEDEVAL_UPLOADS_DIR: /data/uploads/benchmarks
      MEDEVAL_JOB_RUNNER: database
    volumes:
      - mme-data:/data
      # 生产可挂载自有 config（含真实 adapter / judge 配置），覆盖镜像内置默认
      - ${MEDEVAL_CONFIG_HOST_PATH:-./config.yaml}:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: mme-eval:${MME_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${MME_WORKER_MEMORY_LIMIT:-4g}
    cpus: ${MME_WORKER_CPU_LIMIT:-4}
    logging: *default-logging
    command: ["python", "-m", "server.worker"]
    env_file:
      - .env
    environment:
      MEDEVAL_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-medeval}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-medeval}
      MEDEVAL_OUTPUTS_DIR: /data/outputs
      MEDEVAL_UPLOADS_DIR: /data/uploads/benchmarks
      MEDEVAL_JOB_RUNNER: database
    volumes:
      - mme-data:/data
      - ${MEDEVAL_CONFIG_HOST_PATH:-./config.yaml}:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/mme-worker-ready'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p)<20"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 45s

volumes:
  pgdata:
  mme-data:
